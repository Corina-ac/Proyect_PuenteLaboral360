<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuenteLaboral360 - Buscar Talento</title>
    <link rel="stylesheet" href="../../css/general.css">
    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="shortcut icon" href="../../img/educacion-global.ico" type ="image/x-icon">
    <link rel="stylesheet" href="../dashboard-empresa/dashboard-empresa.css">
    <link rel="stylesheet" href="../../css/buscar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/componentes.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body data-roles="empresa,admin">

    <section class="navbar navbar-empresa">
        <a href="../../index.html" class="logo">PuenteLaboral<span>360</span></a>
        <nav>
            <a title="Notificaciones" href="../notificaciones/notificaciones-empresa.html">🔔 </a>
            <a title="Cerrar sesión" href="#" data-accion="cerrar-sesion">Cerrar sesión</a>
        </nav>
    </section>

    <section class="layout-dashboard">

        <section class="sidebar">
            <section class="perfil-mini">
                <img class="avatar" data-perfil="avatar" src="" alt="Foto de perfil">
                <p class="nombre-usuario" data-perfil="nombre">—</p>
                <p class="rol-usuario" data-perfil="rol">—</p>
            </section>
            <nav>
                <a title="Inicio" href="../dashboard-empresa/dashboard-empresa.html"><span>🏠</span> Inicio</a>
                <a title="Buscar Talento" href="buscar-talento.html" class="activo"><span>🔍</span> Buscar Talento</a>
                <a title="Mis Vacantes" href="../mis-vacantes/mis-vacantes.html"><span>📌</span> Mis Vacantes</a>
                <a title="Notificaciones" href="../notificaciones/notificaciones-empresa.html"><span>🔔</span> Notificaciones</a>
            </nav>
        </section>

        <section class="contenido-principal">

            <section class="seccion-intro">
                <h1 class="titulo-pagina">Buscar Talento</h1>
                <p class="subtitulo-pagina">Encuentra candidatos verificados que se ajusten a tus vacantes</p>
            </section>

            <section id="filtros-busqueda" class="tarjeta">
                <h2>🔎 Filtros de búsqueda</h2>
                <section class="form-filtros">
                    <section class="campo campo-flex-lg">
                        <label>Habilidad principal</label>
                        <select id="filtro-habilidad">
                            <option value="">Todas</option>
                        </select>
                    </section>
                    <section class="campo campo-flex">
                        <label>Nivel de experiencia</label>
                        <select id="filtro-nivel-exp">
                            <option value="">Todos</option>
                            <option value="Principiante">Principiante</option>
                            <option value="Junior">Junior</option>
                            <option value="Semi-senior">Semi-senior</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </section>
                    <section class="campo campo-flex">
                        <label>Certificados mínimos</label>
                        <select id="filtro-certificados">
                            <option value="">Cualquiera</option>
                            <option value="1">Al menos 1</option>
                            <option value="2">Al menos 2</option>
                            <option value="3">3 o más</option>
                        </select>
                    </section>
                    <section class="campo campo-flex">
                        <label>Vacante asociada</label>
                        <select id="filtro-vacante-asociada">
                            <option value="">Sin filtrar</option>
                        </select>
                    </section>
                    <button type="button" class="btn btn-rojo btn-filtro" id="btn-buscar-talento">Buscar</button>
                </section>
            </section>

            <section id="resultados-candidatos" class="tarjeta">
                <h2>👥 Candidatos disponibles</h2>
                <p class="texto-secundario" id="contador-candidatos"></p>
            </section>

        </section>
    </section>

    <section class="footer">
        <p>© 2026 <span>PuenteLaboral360</span> — Cerrando la brecha entre educación y empleo</p>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/validaciones.js"></script>
    <script src="../../js/datos.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/componentes.js"></script>
    <script src="../../js/guardia.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/buscar-talento.js"></script>
</body>
</html>
